# Linux の remoteproc から起動され、RPMsg で Linux と話す (段2)
CONFIG_PRINTK=y
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_MAIN_STACK_SIZE=1024

# コードを ATCM、変数を BTCM に分ける (rpmsg.overlay の zephyr,flash / zephyr,sram)
CONFIG_XIP=y
