# Linux の remoteproc から起動され、RPMsg で Linux と話す (段2)
CONFIG_PRINTK=y
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_MAIN_STACK_SIZE=1024

# shell を RPMsg で Linux から使う。名前を rpmsg-raw にして Linux の rpmsg_char (/dev/rpmsgN) で受ける
# (既定の rpmsg-tty はカーネルに rpmsg_tty が無いので使えない)。番号 0x440 でエコー (0x400) と見分ける。
# ★R5 側の番号は 0x400〜0x47F (OpenAMP の RPMSG_ADDR_BMP_SIZE=128) だけ。0x500 にしたら作成失敗した
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RPMSG=y
CONFIG_SHELL_RPMSG_SERVICE_NAME="rpmsg-raw"
CONFIG_SHELL_RPMSG_SRC_ADDR=0x440
# UART の shell は外す (UART1 は Linux のコンソールと共用。Linux への入力を Zephyr も読んでしまう)
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# コードを ATCM、変数を BTCM に分ける (rpmsg.overlay の zephyr,flash / zephyr,sram)
CONFIG_XIP=y
# 初期値つき変数を BTCM に直接置くリンカスクリプト (linker.ld の説明を参照)
CONFIG_HAVE_CUSTOM_LINKER_SCRIPT=y
CONFIG_CUSTOM_LINKER_SCRIPT="linker.ld"
