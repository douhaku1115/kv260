# R5_1 (2 コア目) 用。apps/rpmsg_r5 (R5_0) との違いは UART を使わないことと窓口の番号
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_MAIN_STACK_SIZE=1024

# UART は使わない (Linux のコンソール UART1 の割り込みを止めてしまうため)。表示は shell (RPMsg) だけ
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n

# shell は RPMsg に載せる。R5_0 の shell (0x440) と区別するため 0x441
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RPMSG=y
CONFIG_SHELL_RPMSG_SERVICE_NAME="rpmsg-raw"
CONFIG_SHELL_RPMSG_SRC_ADDR=0x441
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# コードは ATCM、変数は BTCM (R5_0 と同じ。リンカは apps/rpmsg_r5/linker.ld)
CONFIG_XIP=y
CONFIG_HAVE_CUSTOM_LINKER_SCRIPT=y
CONFIG_CUSTOM_LINKER_SCRIPT="../rpmsg_r5/linker.ld"

# R5_0 と割り込みコントローラ (GIC) を共用する (apps/rpmsg_r5/prj.conf の説明を参照)
CONFIG_GIC_SAFE_CONFIG=y
